<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Automated Tracker - mark
       A tracking reticle locked onto a point, with the trail of positions the
       tracker followed to get there. Colours match 05 SCRIPT/gui/theme.py. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e25"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="52" fill="none" stroke="#2a313c" stroke-width="1"/>

  <!-- trail of tracked positions, fading in toward the lock point -->
  <path d="M 52 196 C 70 150, 96 156, 116 132" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <circle cx="52"  cy="196" r="7"  fill="#38bdf8" opacity="0.45"/>
  <circle cx="72"  cy="160" r="8"  fill="#38bdf8" opacity="0.65"/>
  <circle cx="96"  cy="152" r="9"  fill="#38bdf8" opacity="0.85"/>

  <!-- reticle -->
  <circle cx="140" cy="108" r="54" fill="none" stroke="#38bdf8" stroke-width="12"/>
  <line x1="140" y1="22"  x2="140" y2="52"  stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <line x1="140" y1="164" x2="140" y2="194" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <line x1="54"  y1="108" x2="84"  y2="108" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <line x1="196" y1="108" x2="226" y2="108" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>

  <!-- lock point -->
  <circle cx="140" cy="108" r="13" fill="#ffffff"/>
  <circle cx="140" cy="108" r="6"  fill="#3ddc84"/>
</svg>
