name: tests

# The repository holds the source only: COLMAP, FFmpeg, the CoTracker weights
# and the bundled interpreter live in the release runtime, not in git. So this
# job installs just what the pure tests need and runs those. Anything that
# shells out to a real binary or wants a GPU already skips itself, and the full
# suite still runs locally against the bundled Python before every release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Show what is available
        run: |
          python -c "import numpy, PIL, torch; print('numpy', numpy.__version__); print('torch', torch.__version__)"
          python -c "import importlib.util as u; print('PySide6', bool(u.find_spec('PySide6')), '(widget tests skip without it)')"

      - name: Run the tests
        run: python -m pytest tests -q
